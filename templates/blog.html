{% extends "base.html" %}

{% block content %}
<h1 class="title">
  {{ section.title }}
</h1>
<div>
  <!-- If you are using pagination, section.pages will be empty.
       You need to use the paginator object -->  
  {% for page in section.pages %}
  <div class="my_blog_card" >
    <a class="font-bold" href="{{ page.permalink | safe }}">{{ page.title }}</a>
    <div class="my_blog_card_date">{{ page.date }}</div>
  </div>
  {% endfor %}
</div>
{% endblock content %}
